[tool.poetry]
name = "whatsapp-invoice-assistant"
version = "0.1.0"
description = "AI-powered WhatsApp receipt and invoice assistant with Clerk, Twilio, Supabase, pgvector, and OpenAI"
authors = ["WhatsApp Invoice Assistant Contributors"]
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"

[tool.poetry.dependencies]
python = "^3.9"
flask = "^3.0.3"
werkzeug = "^3.0.6"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
pydantic = "^2.10.4"
pydantic-settings = "^2.7.0"
twilio = "^9.4.1"
openai = "^1.59.7"
jinja2 = "^3.1.2"
httpx = "^0.28.1"
pillow = "^11.0.0"
python-dotenv = "^1.0.1"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
pyyaml = "^6.0.2"
pgvector = "^0.3.6"
numpy = "^1.26.0"
pymongo = "^4.6.1"
openpyxl = "^3.1.5"
python-docx = "^1.1.2"
pyjwt = {extras = ["crypto"], version = "^2.10.1"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
pytest-asyncio = "^0.21.1"
black = "^23.9.1"
flake8 = "^6.1.0"
mypy = "^1.5.1"
pre-commit = "^3.5.0"
pytest-cov = "^4.1.0"
faker = "^19.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["twilio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
log_cli = true
log_cli_level = "DEBUG"
